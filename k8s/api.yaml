---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatterbox-models
  namespace: chatterbox
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatterbox-voices
  namespace: chatterbox
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatterbox-longtext-data
  namespace: chatterbox
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatterbox-tts
  namespace: chatterbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatterbox-tts
  template:
    metadata:
      labels:
        app: chatterbox-tts
    spec:
      containers:
        - name: chatterbox-tts
          image: 192.168.1.5/microk8s/chatterbox-tts:0.1.7-turbo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4123
          env:
            - name: PORT
              value: "4123"
            - name: HOST
              value: "0.0.0.0"
            - name: DEVICE
              value: "cuda"
            - name: EXAGGERATION
              value: "0.5"
            - name: CFG_WEIGHT
              value: "0.5"
            - name: TEMPERATURE
              value: "0.8"
            - name: MAX_CHUNK_LENGTH
              value: "280"
            - name: MAX_TOTAL_LENGTH
              value: "3000"
            - name: LONG_TEXT_DATA_DIR
              value: "/data/long_text_jobs"
            - name: LONG_TEXT_MAX_LENGTH
              value: "100000"
            - name: LONG_TEXT_CHUNK_SIZE
              value: "2500"
            - name: LONG_TEXT_SILENCE_PADDING_MS
              value: "200"
            - name: LONG_TEXT_JOB_RETENTION_DAYS
              value: "7"
            - name: LONG_TEXT_MAX_CONCURRENT_JOBS
              value: "3"
            # Fallback voice for OpenAI names (alloy, ...) and unknown voices. The built-in
            # /app/voice-sample.mp3 is 3.0 s, but the Turbo model needs > 5 s, so those requests failed.
            - name: VOICE_SAMPLE_PATH
              value: "/voices/stewie.mp3"
            - name: MODEL_CACHE_DIR
              value: "/cache"
            - name: VOICE_LIBRARY_DIR
              value: "/voices"
            - name: USE_TURBO_MODEL
              value: "true"
            - name: USE_MULTILINGUAL_MODEL
              value: "false"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            # Hard per-container CUDA memory cap in MiB (toolkit 1.20.1 + driver R615 CDI hook), added 2026-11-08.
            - name: NVIDIA_GPU_MEMORY_LIMIT
              value: "8192"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /cache
            - name: voices
              mountPath: /voices
            - name: longtext-data
              mountPath: /data/long_text_jobs
          livenessProbe:
            httpGet:
              path: /health
              port: 4123
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4123
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: chatterbox-models
        - name: voices
          persistentVolumeClaim:
            claimName: chatterbox-voices
        - name: longtext-data
          persistentVolumeClaim:
            claimName: chatterbox-longtext-data
      runtimeClassName: nvidia
---
apiVersion: v1
kind: Service
metadata:
  name: chatterbox-tts
  namespace: chatterbox
spec:
  selector:
    app: chatterbox-tts
  ports:
    - port: 4123
      targetPort: 4123
  type: ClusterIP
